name = "openweathermap-6310"
main = "src/index.mjs"
compatibility_date = "2026-11-22"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://doctorstrangesh.github.io,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000"

# Per-client edge rate limit: 60 valid API requests per minute.
[[unsafe.bindings]]
name = "WEATHER_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
